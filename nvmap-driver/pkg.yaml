name: nvmap-driver-pkg
variant: scratch
shell: /bin/bash
dependencies:
  - stage: base
  - stage: kernel-build
steps:
  - sources:
      - url: https://github.com/OE4T/linux-nv-oot/archive/{{ .jetson_nvmap_ref }}.tar.gz
        destination: nv-oot.tar.gz
        sha256: "{{ .jetson_nvmap_sha256 }}"
        sha512: "{{ .jetson_nvmap_sha512 }}"
    env:
      ARCH: {{ if eq .ARCH "aarch64"}}arm64{{ else if eq .ARCH "x86_64" }}x86_64{{ else }}unsupported{{ end }}
    prepare:
      - |
        mkdir -p /nv-oot
        tar -xzf nv-oot.tar.gz -C /nv-oot --strip-components=1
      - |
        # Install kernel compatibility header for nvmap on Linux 6.18.
        #
        # nvmap source files include <nvidia/conftest.h> to get NV_* feature macros
        # that select the correct kernel API code path (e.g. 4-arg get_user_pages,
        # percpu rss_stat, iosys_map vmap, etc.).
        #
        # The upstream conftest.sh probe system compiles small test programs against
        # the kernel headers to detect API changes at build time.  In our Talos pkgs
        # build environment the probe programs cannot find the generated headers they
        # depend on, so all probes fail silently and every NV_* macro is left
        # undefined -- selecting stale code paths that do not compile on kernel 6.18.
        #
        # Solution: install a static compat header that defines the correct NV_*
        # values for Linux 6.18 directly, skipping conftest entirely.
        # With KCPPFLAGS="-I/conftest", '#include <nvidia/conftest.h>' resolves
        # to /conftest/nvidia/conftest.h (our static file).
        mkdir -p /conftest/nvidia
        cp /pkg/files/nvmap_compat.h /conftest/nvidia/conftest.h
    build:
      - |
        make -j $(nproc) -C /src \
          M=/nv-oot/drivers/video/tegra/nvmap \
          ARCH=${ARCH} \
          CONFIG_ARCH_TEGRA=y \
          CONFIG_TEGRA_OOT_MODULE=m \
          "srctree.nvidia-oot=/nv-oot" \
          "srctree.nvconftest=/conftest" \
          KCPPFLAGS="-I/nv-oot/include -I/conftest" \
          NVMAP_CONFIG_SCIIPC=n \
          modules
    install:
      - |
        KRELEASE=$(cat /src/include/config/kernel.release)
        mkdir -p /rootfs/usr/lib/modules/${KRELEASE}/

        cp /src/modules.order /rootfs/usr/lib/modules/${KRELEASE}/
        cp /src/modules.builtin /rootfs/usr/lib/modules/${KRELEASE}/
        cp /src/modules.builtin.modinfo /rootfs/usr/lib/modules/${KRELEASE}/

        make -C /src M=/nv-oot/drivers/video/tegra/nvmap modules_install \
          INSTALL_MOD_PATH=/rootfs/usr \
          INSTALL_MOD_DIR=extras \
          INSTALL_MOD_STRIP=1 \
          CONFIG_MODULE_SIG_ALL=y
    test:
      - |
        find /rootfs/usr/lib/modules -name '*.ko' -exec grep -FL '~Module signature appended~' {} \+
      - |
        fhs-validator /rootfs
finalize:
  - from: /rootfs
    to: /
