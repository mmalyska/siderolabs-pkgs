---
# Custom CI for nvidia-container-toolkit-tegra-pkg — builds Go binaries for aarch64 Tegra.
# Does not require the kernel-build stage (pure Go package).
# Uses GitHub-hosted arm64 runners.
#
# Triggers: push/PR on feat/jetson-nvgpu or main; manual dispatch.
concurrency:
  group: ${{ github.head_ref || github.run_id }}-nvidia-container-toolkit-tegra
  cancel-in-progress: true

"on":
  push:
    branches:
      - main
      - feat/jetson-nvgpu
    tags:
      - v*
  pull_request:
    branches:
      - main
      - feat/jetson-nvgpu
  workflow_dispatch: {}

name: nvidia-container-toolkit-tegra

jobs:
  build:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04-arm
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (PR — no push)
        if: github.event_name == 'pull_request'
        run: |
          make nvidia-container-toolkit-tegra-pkg \
            PLATFORM=linux/arm64 \
            REGISTRY=ghcr.io \
            USERNAME=${{ github.repository_owner }} \
            CI_ARGS="--cache-from type=registry,ref=ghcr.io/${{ github.repository_owner }}/nvidia-container-toolkit-tegra-pkg:buildcache"

      - name: Build and push
        if: github.event_name != 'pull_request'
        run: |
          make nvidia-container-toolkit-tegra-pkg \
            PLATFORM=linux/arm64 \
            REGISTRY=ghcr.io \
            USERNAME=${{ github.repository_owner }} \
            PUSH=true \
            CI_ARGS="--cache-from type=registry,ref=ghcr.io/${{ github.repository_owner }}/nvidia-container-toolkit-tegra-pkg:buildcache \
                     --cache-to type=registry,ref=ghcr.io/${{ github.repository_owner }}/nvidia-container-toolkit-tegra-pkg:buildcache,mode=max"
