---
# Custom CI for nvgpu-driver-pkg — uses GitHub-hosted arm64 runners
# because the upstream private BuildKit fleet is not available in this fork.
#
# Triggers: push/PR on feat/jetson-nvgpu or main; manual dispatch.
concurrency:
  group: ${{ github.head_ref || github.run_id }}-nvgpu-driver
  cancel-in-progress: true

"on":
  push:
    branches:
      - main
      - feat/jetson-nvgpu
    tags:
      - v*
  pull_request:
    branches:
      - main
      - feat/jetson-nvgpu
  workflow_dispatch: {}

name: nvgpu-driver

jobs:
  build:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04-arm
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (PR — no push)
        if: github.event_name == 'pull_request'
        run: |
          make nvgpu-driver \
            PLATFORM=linux/arm64 \
            REGISTRY=ghcr.io \
            USERNAME=${{ github.repository_owner }}

      - name: Build and push
        if: github.event_name != 'pull_request'
        run: |
          make nvgpu-driver \
            PLATFORM=linux/arm64 \
            REGISTRY=ghcr.io \
            USERNAME=${{ github.repository_owner }} \
            PUSH=true
