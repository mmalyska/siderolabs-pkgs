name: nvidia-container-toolkit-tegra-pkg
variant: scratch
shell: /bin/bash
install:
  - build-base
  - gcc
  - bash
  - go
dependencies:
  - image: cgr.dev/chainguard/wolfi-base@{{ .WOLFI_BASE_REF }}
steps:
  - sources:
      - url: https://github.com/NVIDIA/nvidia-container-toolkit/archive/refs/tags/{{ .nvidia_container_toolkit_version }}.tar.gz
        destination: container-toolkit.tar.gz
        sha256: "{{ .nvidia_container_toolkit_sha256 }}"
        sha512: "{{ .nvidia_container_toolkit_sha512 }}"
    env:
      # Short sha for embedding in binary version string
      GIT_COMMIT: "{{ substr 0 7 .nvidia_container_toolkit_ref }}"
    prepare:
      - |
        mkdir -p /container-toolkit
        tar -xzf container-toolkit.tar.gz --strip-components=1 -C /container-toolkit
    build:
      - |
        # CGO is required — go-nvml/pkg/dl and internal/cuda are CGO-only packages
        # (build constraints exclude all Go files when CGO_ENABLED=0).
        # Override EXTLDFLAGS with -static so the Makefile produces fully static binaries.
        # Talos has no glibc dynamic linker (/lib/ld-linux-aarch64.so.1) so dynamic
        # binaries won't run. Static linking bakes in libdl, which can still lazy-load
        # libnvidia-ml.so at runtime (not required for Tegra CSV-based device discovery).
        # nvidia-cdi-hook is excluded — it imports go-nvml CDI hooks not needed for CSV mode.
        cd /container-toolkit
        make EXTLDFLAGS="-static" \
          cmd-nvidia-container-runtime \
          cmd-nvidia-container-runtime-hook \
          cmd-nvidia-container-runtime.cdi \
          cmd-nvidia-container-runtime.legacy \
          cmd-nvidia-ctk
    install:
      - |
        mkdir -p /rootfs/usr/local/bin
        cd /container-toolkit
        # Install all built binaries — nvidia-container-runtime, nvidia-container-runtime-hook,
        # nvidia-container-runtime.cdi, nvidia-container-runtime.legacy, nvidia-ctk, nvidia-ctk-installer
        # The Makefile places binaries in the project root after 'make cmds'
        find . -maxdepth 1 -type f -executable -exec cp {} /rootfs/usr/local/bin/ \;
        # Verify at least one key binary landed
        ls -la /rootfs/usr/local/bin/nvidia-container-runtime
    test:
      - |
        # Verify key binaries are present
        ls -la /rootfs/usr/local/bin/nvidia-container-runtime
        ls -la /rootfs/usr/local/bin/nvidia-ctk
        /rootfs/usr/local/bin/nvidia-container-runtime --version 2>&1 || true
finalize:
  - from: /rootfs
    to: /
